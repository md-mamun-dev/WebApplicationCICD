name: ASP.NET Web API CI/CD with backup run on failed deploy

on:
  push:
    branches:
      - master

  workflow_dispatch:


# ==================================================
# GLOBAL VARIABLES
# ==================================================
env:
  BUILD_CONFIGURATION: Release

  ARTIFACT_NAME: WebApi

  APP_POOL_NAME: TestApplicationPool

  IIS_PATH: C:\inetpub\wwwroot\TestApplication

  BACKUP_PATH: C:\Backups\TestApplicationPool

  BACKUP_RETENTION_COUNT: 10

  DEPLOY_PATH: C:\deploy\WebApi

  # Optional. Set to a real health-check route to enable the
  # post-deploy smoke test. Leave blank to skip it.
  HEALTH_CHECK_URL: ""


# Stops two deploys (e.g. a manual run racing a push) from
# fighting over the same IIS folder at the same time.
# concurrency:
#   group: deploy-aspwebapi6
#   cancel-in-progress: false

permissions:
  contents: read


jobs:

  # ==================================================
  # BUILD
  # ==================================================
  build:
    name: Build and Publish Web API

    runs-on: windows-latest

    timeout-minutes: 20

    defaults:
      run:
        shell: powershell

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2


      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      - name: Find Solution
        run: |
          $ErrorActionPreference = "Stop"

          $slnx = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.slnx -Recurse |
            Select-Object -First 1

          if (-not $slnx) {
              Write-Error "No .slnx file found."
              exit 1
          }

          Write-Host "Solution found: $($slnx.FullName)"
          "SOLUTION=$($slnx.FullName)" >> $env:GITHUB_ENV


      - name: Restore NuGet Packages
        run: |
          $ErrorActionPreference = "Stop"

          nuget restore "$env:SOLUTION"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "nuget restore failed (exit code $LASTEXITCODE)."
              exit 1
          }


      - name: Build and Publish
        run: |
          $ErrorActionPreference = "Stop"

          $publishPath = "$env:GITHUB_WORKSPACE\publish_output"

          if (Test-Path $publishPath) {
              Remove-Item $publishPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $publishPath -Force | Out-Null

          Write-Host "Publishing to: $publishPath"

          msbuild "$env:SOLUTION" `
            /m `
            /p:Configuration=$env:BUILD_CONFIGURATION `
            /p:Platform="Any CPU" `
            /p:DeployOnBuild=true `
            /p:DeployDefaultTarget=WebPublish `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="$publishPath"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "msbuild failed (exit code $LASTEXITCODE)."
              exit 1
          }

          $files = Get-ChildItem -Path $publishPath -Recurse -File
          if ($files.Count -eq 0) {
              Write-Error "Publish folder is empty."
              exit 1
          }
          Write-Host "Published files: $($files.Count)"


      - name: Upload Web API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/publish_output
          if-no-files-found: error
          retention-days: 2


  # ==================================================
  # DEPLOY
  # ==================================================
  deploy:
    name: Deploy to IIS

    needs: build

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 20

    defaults:
      run:
        shell: powershell

    steps:

      - name: Download Web API Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DEPLOY_PATH }}


      - name: Verify Artifact
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem -Path $env:DEPLOY_PATH -Recurse -File
          if ($files.Count -eq 0) {
              Write-Error "Artifact folder is empty: $env:DEPLOY_PATH"
              exit 1
          }
          Write-Host "Downloaded files: $($files.Count)"


